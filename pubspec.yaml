name: indoor_nav
description: MVP indoor navigation app using BLE beacon RSSI zone-snapping and Dijkstra pathfinding.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.3.1
  flutter_svg: ^2.0.10
  permission_handler: ^11.3.1

dependency_overrides:
  reactive_ble_mobile:
    path: local_packages/reactive_ble_mobile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.8.0
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/store_data.json
    - assets/floorMap.svg
